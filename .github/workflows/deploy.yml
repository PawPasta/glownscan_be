
name: GlownScan Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: glownscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  docker:
    name: Build and Push Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy container
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            docker pull "$IMAGE:$IMAGE_TAG"

            PREVIOUS_IMAGE=""
            if docker container inspect glownscan-api >/dev/null 2>&1; then
              PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' glownscan-api)"
              docker stop glownscan-api
              docker rm glownscan-api
            fi

            rollback() {
              docker stop glownscan-api 2>/dev/null || true
              docker rm glownscan-api 2>/dev/null || true
              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker run -d \
                  --name glownscan-api \
                  --restart unless-stopped \
                  --env-file /opt/glownscan/.env \
                  -p 127.0.0.1:3000:3000 \
                  "$PREVIOUS_IMAGE"
              else
                echo "No previous image is available for rollback."
              fi
            }

            if ! docker run -d \
                --name glownscan-api \
                --restart unless-stopped \
                --env-file /opt/glownscan/.env \
                -p 127.0.0.1:3000:3000 \
                "$IMAGE:$IMAGE_TAG"; then
              echo "Failed to start the new container."
              docker logs --tail 100 glownscan-api || true
              rollback
              exit 1
            fi

            HEALTHY=0
            ATTEMPT=0
            while [ "$ATTEMPT" -lt 30 ]; do
              if docker exec glownscan-api node -e \
                'fetch("http://127.0.0.1:3000/health/database").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'; then
                HEALTHY=1
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "The new container did not pass the database health check."
              docker logs --tail 100 glownscan-api || true
              rollback
              exit 1
            fi

            docker image prune -f
