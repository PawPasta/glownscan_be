name: GlownScan Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glownscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      GLOWNSCAN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glownscan_test
      GLOWNSCAN_JWT_ACCESS_SECRET: ci-only-jwt-secret-that-is-longer-than-32-characters
      GLOWNSCAN_JWT_ISSUER: glownscan-api-ci
      GLOWNSCAN_JWT_AUDIENCE: glownscan-client-ci
      GLOWNSCAN_SMTP_HOST: localhost
      GLOWNSCAN_SMTP_USER: ci-user
      GLOWNSCAN_SMTP_PASSWORD: ci-password
      GLOWNSCAN_SMTP_FROM: noreply@example.test
      GLOWNSCAN_FRONTEND_URL: http://localhost:5173
      GLOWNSCAN_FIREBASE_PROJECT_ID: glownscan-ci
      GLOWNSCAN_CLOUDINARY_CLOUD_NAME: ci-cloud
      GLOWNSCAN_CLOUDINARY_API_KEY: ci-key
      GLOWNSCAN_CLOUDINARY_API_SECRET: ci-secret
      GLOWNSCAN_GEMINI_API_KEY: ci-gemini-key
      GLOWNSCAN_REDIS_URL: redis://localhost:6379
      GLOWNSCAN_SEPAY_WEBHOOK_SECRET: ci-only-sepay-webhook-secret
      GLOWNSCAN_SEPAY_BANK_ACCOUNT_NUMBER: '0000000000'
      GLOWNSCAN_BANK_ACCOUNT_NAME: CI TEST
      GLOWNSCAN_BANK_BIN: '970423'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: glownscan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glownscan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts" "scripts/**/*.mjs"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit --project tsconfig.build.json

      - name: Run unit tests
        run: npm test

      - name: Run unit-test coverage
        run: npm run test:cov

      - name: Check critical business coverage
        run: npm run test:coverage:critical

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Apply test database schema
        run: npm run db:migrate

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application
        run: npm run build

  changes:
    name: Detect deployment-relevant changes
    runs-on: ubuntu-latest

    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}

    steps:
      - name: Checkout source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether deployment is required
        id: detect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null && ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "Could not fetch the previous commit; deploying as a safe fallback."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|test/*|tests/*|*.md|*.spec.ts|*.e2e-spec.ts|*.test.ts)
                ;;
              *)
                deploy=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BEFORE" "$GITHUB_SHA")

          if [[ "$deploy" == "true" ]]; then
            echo "Changes include files outside documentation and tests; deployment is required."
          else
            echo "Changes are limited to documentation and tests; image build and deployment will be skipped."
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and Push Image
    needs: [ci, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2 via SSM
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY=$(aws sts get-caller-identity --output json)
          ACCOUNT_ID=$(jq -r '.Account' <<< "$IDENTITY")
          PRINCIPAL_ARN=$(jq -r '.Arn' <<< "$IDENTITY")

          echo "AWS account: $ACCOUNT_ID"
          echo "AWS principal: $PRINCIPAL_ARN"

          if [[ "$ACCOUNT_ID" != "877886324433" || "$PRINCIPAL_ARN" != "arn:aws:iam::877886324433:user/GlownScanGitHubActions" ]]; then
            echo "::error::AWS credentials do not identify the expected GlownScan deployment IAM user."
            exit 1
          fi

      - name: Verify EC2 is managed by SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          if [ "$STATUS" != "Online" ]; then
            echo "EC2 is not Online in Systems Manager. Status: $STATUS"
            exit 1
          fi

      - name: Deploy container through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ needs.docker.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # This script contains no credentials.
          # Docker must already be authenticated to GHCR for the ubuntu user.
          cat > deploy.sh <<'DEPLOY_SCRIPT'
          set -eu

          IMAGE="__IMAGE__"
          IMAGE_TAG="__IMAGE_TAG__"
          NEW_IMAGE="$IMAGE:$IMAGE_TAG"
          DOCKER_NETWORK="glownscan-net"
          REDIS_CONTAINER="glownscan-redis"

          cd /opt/glownscan

          if [ ! -r /opt/glownscan/firebase-service-account.json ]; then
            echo "Firebase Admin service-account file is missing or unreadable."
            exit 1
          fi

          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || \
            docker network create "$DOCKER_NETWORK"
          docker volume create glownscan-redis-data >/dev/null

          if ! docker container inspect "$REDIS_CONTAINER" >/dev/null 2>&1; then
            docker run -d \
              --name "$REDIS_CONTAINER" \
              --network "$DOCKER_NETWORK" \
              --network-alias redis \
              --restart unless-stopped \
              --mount source=glownscan-redis-data,target=/data \
              redis:7-alpine redis-server --appendonly yes
          else
            docker network connect --alias redis "$DOCKER_NETWORK" "$REDIS_CONTAINER" 2>/dev/null || true
            docker start "$REDIS_CONTAINER" >/dev/null 2>&1 || true
          fi

          REDIS_READY=0
          REDIS_ATTEMPT=0
          while [ "$REDIS_ATTEMPT" -lt 30 ]; do
            if docker exec "$REDIS_CONTAINER" redis-cli ping 2>/dev/null | grep -q PONG; then
              REDIS_READY=1
              break
            fi
            REDIS_ATTEMPT=$((REDIS_ATTEMPT + 1))
            sleep 2
          done
          if [ "$REDIS_READY" -ne 1 ]; then
            echo "Redis did not become ready."
            docker logs --tail 100 "$REDIS_CONTAINER" 2>/dev/null || true
            exit 1
          fi

          PREVIOUS_IMAGE=""
          if docker container inspect glownscan-api >/dev/null 2>&1; then
            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' glownscan-api)"
          fi

          docker pull "$NEW_IMAGE"

          # Migrations are forward-only expand changes. Do not attempt schema
          # rollback when rolling the application image back.
          docker run --rm \
            --env-file /opt/glownscan/.env \
            "$NEW_IMAGE" node database/migrate.js up

          rollback() {
            echo "Deployment failed; attempting rollback."
            docker stop glownscan-api 2>/dev/null || true
            docker rm glownscan-api 2>/dev/null || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              docker run -d \
                --name glownscan-api \
                --restart unless-stopped \
                --network "$DOCKER_NETWORK" \
                --env-file /opt/glownscan/.env \
                --mount type=bind,src=/opt/glownscan/firebase-service-account.json,dst=/app/secrets/firebase-service-account.json,readonly \
                -p 127.0.0.1:3000:3000 \
                "$PREVIOUS_IMAGE"
            else
              echo "No previous image is available for rollback."
            fi
          }

          docker stop glownscan-api 2>/dev/null || true
          docker rm glownscan-api 2>/dev/null || true

          if ! docker run -d \
            --name glownscan-api \
            --restart unless-stopped \
            --network "$DOCKER_NETWORK" \
            --env-file /opt/glownscan/.env \
            --mount type=bind,src=/opt/glownscan/firebase-service-account.json,dst=/app/secrets/firebase-service-account.json,readonly \
            -p 127.0.0.1:3000:3000 \
            "$NEW_IMAGE"; then
            docker logs --tail 100 glownscan-api 2>/dev/null || true
            rollback
            exit 1
          fi

          HEALTHY=0
          ATTEMPT=0

          while [ "$ATTEMPT" -lt 30 ]; do
            if docker exec glownscan-api node -e \
              'fetch("http://127.0.0.1:3000/health/database").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              HEALTHY=1
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Database health check failed."
            docker logs --tail 100 glownscan-api 2>/dev/null || true
            rollback
            exit 1
          fi

          docker image prune -f
          echo "Deployment successful: $NEW_IMAGE"
          DEPLOY_SCRIPT

          # Substitute the image values without interpolating them into shell code.
          sed -i \
            -e "s|__IMAGE__|$IMAGE|g" \
            -e "s|__IMAGE_TAG__|$IMAGE_TAG|g" \
            deploy.sh

          # SSM runs commands as root by default. Run Docker as ubuntu,
          # whose Docker login is used for the private GHCR package.
          BASE64_SCRIPT=$(base64 -w 0 deploy.sh)
          REMOTE_COMMAND="echo '$BASE64_SCRIPT' | base64 -d | sudo -u ubuntu bash"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GlownScan deployment $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for ATTEMPT in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed. SSM status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1
