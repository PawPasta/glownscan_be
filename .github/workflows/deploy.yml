
name: GlownScan Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: glownscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  docker:
    name: Build and Push Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2 via SSM
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify EC2 is managed by SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          if [ "$STATUS" != "Online" ]; then
            echo "EC2 is not Online in Systems Manager. Status: $STATUS"
            exit 1
          fi

      - name: Deploy container through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ needs.docker.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # This script contains no credentials.
          # Docker must already be authenticated to GHCR for the ubuntu user.
          cat > deploy.sh <<'DEPLOY_SCRIPT'
          set -eu

          IMAGE="__IMAGE__"
          IMAGE_TAG="__IMAGE_TAG__"
          NEW_IMAGE="$IMAGE:$IMAGE_TAG"

          cd /opt/glownscan

          PREVIOUS_IMAGE=""
          if docker container inspect glownscan-api >/dev/null 2>&1; then
            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' glownscan-api)"
          fi

          docker pull "$NEW_IMAGE"

          rollback() {
            echo "Deployment failed; attempting rollback."
            docker stop glownscan-api 2>/dev/null || true
            docker rm glownscan-api 2>/dev/null || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              docker run -d \
                --name glownscan-api \
                --restart unless-stopped \
                --env-file /opt/glownscan/.env \
                -p 127.0.0.1:3000:3000 \
                "$PREVIOUS_IMAGE"
            else
              echo "No previous image is available for rollback."
            fi
          }

          docker stop glownscan-api 2>/dev/null || true
          docker rm glownscan-api 2>/dev/null || true

          if ! docker run -d \
            --name glownscan-api \
            --restart unless-stopped \
            --env-file /opt/glownscan/.env \
            -p 127.0.0.1:3000:3000 \
            "$NEW_IMAGE"; then
            docker logs --tail 100 glownscan-api 2>/dev/null || true
            rollback
            exit 1
          fi

          HEALTHY=0
          ATTEMPT=0

          while [ "$ATTEMPT" -lt 30 ]; do
            if docker exec glownscan-api node -e \
              'fetch("http://127.0.0.1:3000/health/database").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              HEALTHY=1
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Database health check failed."
            docker logs --tail 100 glownscan-api 2>/dev/null || true
            rollback
            exit 1
          fi

          docker image prune -f
          echo "Deployment successful: $NEW_IMAGE"
          DEPLOY_SCRIPT

          # Substitute the image values without interpolating them into shell code.
          sed -i \
            -e "s|__IMAGE__|$IMAGE|g" \
            -e "s|__IMAGE_TAG__|$IMAGE_TAG|g" \
            deploy.sh

          # SSM runs commands as root by default. Run Docker as ubuntu,
          # whose Docker login is used for the private GHCR package.
          BASE64_SCRIPT=$(base64 -w 0 deploy.sh)
          REMOTE_COMMAND="echo '$BASE64_SCRIPT' | base64 -d | sudo -u ubuntu bash"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GlownScan deployment $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for ATTEMPT in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed. SSM status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1
